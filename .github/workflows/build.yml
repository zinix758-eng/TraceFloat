name: Build TraceFloat APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TraceFloat-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -o TraceFloat-Android-Project.zip -d project

                - name: Fix Java source
        run: |
          sed -i '/^\\n$/d' project/app/src/main/java/com/tracefloat/app/OverlayService.java

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraceFloat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
